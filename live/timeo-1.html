   <script type="text/javascript">
        function showLessonsInAWeek(id){
            hideAll();
            var lessons_wrap = document.getElementById(id);
            lessons_wrap.classList.add('b-show');
            lessons_wrap.style.display = "flex";

        }

        function hideAll() {
            var lessons_wrap = document.getElementsByClassName('lessons_wrap');
            for (var i = 0; i < lessons_wrap.length; ++i) {
                lessons_wrap[i].style.display = 'none';
            }
        }
    </script>
