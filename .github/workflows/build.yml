name: Сборка

on:
  push:
    branches: [main]
    # Правки только в автотестах экранов и описании версию приложения не меняют, выпускать её заново не нужно.
    paths-ignore:
      - "app/src/androidTest/**"
      - ".github/workflows/ui-tests.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Ключ подписи
        if: env.SIGNING_KEYSTORE != ''
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Тесты и сборка
        run: |
          set -o pipefail
          gradle --no-daemon --continue testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Выпуск версии
        if: success() && env.SIGNING_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk kazhdyidnevnik.apk
          # В описание версии не попадают служебные строки об авторстве коммита.
          CLEAN=$(printf '%s\n' "$NOTES" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' || true)
          gh release create "v1.0.${VERSION_CODE}" kazhdyidnevnik.apk \
            --title "Версия 1.0.${VERSION_CODE}" \
            --notes "${CLEAN:-Новая версия}"

      - name: Копия для jsDelivr
        # Запасной адрес обновления: у некоторых операторов GitHub отдаёт файл по капле. Метка apk-v1.0.N
        # указывает на коммит, в котором лежит только APK; приложение качает его с cdn.jsdelivr.net.
        if: success() && env.SIGNING_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TAG="apk-v1.0.${VERSION_CODE}"
          mkdir -p "$RUNNER_TEMP/mirror" && cd "$RUNNER_TEMP/mirror"
          git init -q
          cp "$GITHUB_WORKSPACE/kazhdyidnevnik.apk" .
          git add kazhdyidnevnik.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK 1.0.${VERSION_CODE}"
          git tag "$TAG"
          git push -q "$REMOTE" "$TAG" || echo "mirror push failed" >> "$GITHUB_WORKSPACE/build.log"
          # Старые копии не нужны: оставляем три последние.
          git ls-remote --tags "$REMOTE" 'apk-v*' | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' | sort -V | head -n -3 \
            | while read -r old; do git push -q "$REMOTE" ":refs/tags/$old" || true; done || true
          # Разогреть jsDelivr, чтобы первый телефон не ждал, и записать, что он ответил.
          sleep 20
          curl -sL -o /dev/null -w "jsdelivr: %{http_code} %{size_download}\n" \
            "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${TAG}/kazhdyidnevnik.apk" >> "$GITHUB_WORKSPACE/build.log" || true

      - name: Отчёт о сборке
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/status" && cd "$RUNNER_TEMP/status"
          {
            echo "run=${VERSION_CODE}"
            echo "sha=${GITHUB_SHA}"
            echo "result=${RESULT}"
            echo "signed=$([ -n "$SIGNING_KEYSTORE" ] && echo yes || echo no)"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
            grep -E "^e: |error:|FAILED|BUILD|tests completed" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -n 60 || true
            echo "--- what went wrong ---"
            grep -A 25 "What went wrong" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -n 120 || true
            echo "apk=$(stat -c %s "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" 2>/dev/null)"
            grep -E "^jsdelivr:|mirror push failed" "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
            echo "--- tail ---"
            tail -n 60 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
          } > status.txt
          git init -q
          git checkout -q -b ci-status
          git add status.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Сборка ${VERSION_CODE}: ${RESULT}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status
