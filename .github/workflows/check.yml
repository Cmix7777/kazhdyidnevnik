name: Проверка ветки

# Сборка, обычные тесты и проверки на эмуляторе для рабочей ветки. В телефоны попадает только main:
# туда коммит уходит сам, если в нём пометка [выпуск] и вся проверка зелёная.
on:
  push:
    branches: [effects]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Сборка и обычные тесты
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --continue testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease 2>&1 | tee build.log

      - name: Ускорение эмулятора (KVM)
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Кадры анимаций на эмуляторе
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c || true
            adb shell am instrument -w -e class io.github.cmix7777.kazhdyidnevnik.AppScreensTest io.github.cmix7777.kazhdyidnevnik.test/androidx.test.runner.AndroidJUnitRunner > screens.log 2>&1 || true
            adb logcat -d -v time > logcat.txt 2>&1 || true
            adb shell am instrument -w -e class io.github.cmix7777.kazhdyidnevnik.TogetherWeekShotsTest,io.github.cmix7777.kazhdyidnevnik.SpecialDayShotsTest,io.github.cmix7777.kazhdyidnevnik.WeatherShotsTest,io.github.cmix7777.kazhdyidnevnik.LiveUiShotsTest,io.github.cmix7777.kazhdyidnevnik.GreetingRealAppTest,io.github.cmix7777.kazhdyidnevnik.ChatShotsTest,io.github.cmix7777.kazhdyidnevnik.ChatCloudLiveTest,io.github.cmix7777.kazhdyidnevnik.CloudFlowTest,io.github.cmix7777.kazhdyidnevnik.LiveFlowsUiTest,io.github.cmix7777.kazhdyidnevnik.ChatActivityFlowTest,io.github.cmix7777.kazhdyidnevnik.ScheduleSyncFlowTest,io.github.cmix7777.kazhdyidnevnik.PairingFlowUiTest,io.github.cmix7777.kazhdyidnevnik.GlassEffectsVisibleTest,io.github.cmix7777.kazhdyidnevnik.VoiceTextTest,io.github.cmix7777.kazhdyidnevnik.ChatPinsSearchUiTest io.github.cmix7777.kazhdyidnevnik.test/androidx.test.runner.AndroidJUnitRunner > instrument.log 2>&1 || true
            sh .github/retry-failed.sh instrument.log instrument-retry.log || true
            sh .github/retry-failed.sh screens.log screens-retry.log || true
            adb pull /sdcard/Android/data/io.github.cmix7777.kazhdyidnevnik/files/shots shots || true
            sh .github/release-smoke.sh > release.log 2>&1 || true

      # Коммит с пометкой [выпуск] после полностью зелёной проверки сам уходит в main и собирается в новую версию.
      - name: Выпуск, если всё зелёное
        if: github.ref == 'refs/heads/effects' && contains(github.event.head_commit.message, '[выпуск]')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          cd "$GITHUB_WORKSPACE"
          why=""
          [ "$BUILD" = success ] || why="$why сборка"
          passed() { grep -q "^OK (" "$1" 2>/dev/null || grep -q "RETRY OK" "$2" 2>/dev/null; }
          passed instrument.log instrument-retry.log || why="$why тесты-на-эмуляторе"
          passed screens.log screens-retry.log || why="$why экраны"
          grep -q "release OK" release.log 2>/dev/null || why="$why выпускная-сборка"
          if [ -n "$why" ]; then echo "не выпущено: не прошло$why" > release-result.txt; exit 0; fi
          git fetch -q origin main
          git log -1 --format=%B "$GITHUB_SHA" | sed 's/ *\[выпуск\]//' > "$RUNNER_TEMP/relmsg.txt"
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an "$GITHUB_SHA")" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$GITHUB_SHA")"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          new=$(git commit-tree "${GITHUB_SHA}^{tree}" -p FETCH_HEAD -F "$RUNNER_TEMP/relmsg.txt")
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$new:refs/heads/main"
          gh workflow run build.yml --ref main
          echo "выпущено: main=$new, сборка версии запущена" > release-result.txt

      - name: Отчёт проверки
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/report" && cd "$RUNNER_TEMP/report"
          {
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "build=${BUILD}"
            echo "result=${RESULT}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- errors ---"
            grep -E "^e: |error:|FAILED|BUILD|tests completed|warning:.*deprecated" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | grep -v SystemServerTiming | head -n 40 || true
            echo "--- what went wrong ---"
            grep -A 25 "What went wrong" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -n 120 || true
            echo "--- instrument ---"
            tail -n 80 "$GITHUB_WORKSPACE/instrument.log" 2>/dev/null || true
            echo "--- screens ---"
            grep -v "^\s*at " "$GITHUB_WORKSPACE/screens.log" 2>/dev/null | tail -n 40 || true
            echo "--- retry ---"
            cat "$GITHUB_WORKSPACE/instrument-retry.log" "$GITHUB_WORKSPACE/screens-retry.log" 2>/dev/null || true
            echo "--- release ---"
            cat "$GITHUB_WORKSPACE/release.log" 2>/dev/null | tail -n 40 || true
            echo "--- publish ---"
            cat "$GITHUB_WORKSPACE/release-result.txt" 2>/dev/null || echo "без пометки [выпуск]"
            echo "--- live ---"
            grep -h "LIVE:" "$GITHUB_WORKSPACE"/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -n 80 || true
            echo "--- logcat ---"
            grep -iE "Denying clipboard|ANR in|not responding|FATAL EXCEPTION|Input dispatching timed out" "$GITHUB_WORKSPACE/logcat.txt" 2>/dev/null | grep -v SystemServerTiming | head -n 40 || true
          } > status.txt
          cp -r "$GITHUB_WORKSPACE/shots" . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/app/build/live" . 2>/dev/null || true
          mkdir -p tests && cp -r "$GITHUB_WORKSPACE"/app/build/test-results/testDebugUnitTest/*.xml tests/ 2>/dev/null || true
          git init -q
          git checkout -q -b ci-check
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Проверка ${GITHUB_RUN_NUMBER}: ${RESULT}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-check
