name: Проверка ветки

# Сборка, обычные тесты и кадры анимаций на эмуляторе для рабочей ветки. Версию не выпускает:
# в телефоны попадает только то, что потом слито в main.
on:
  push:
    branches: [effects]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Сборка и обычные тесты
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --continue testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log

      - name: Ускорение эмулятора (KVM)
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Кадры анимаций на эмуляторе
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c || true
            adb shell am instrument -w -e class io.github.cmix7777.kazhdyidnevnik.AppScreensTest io.github.cmix7777.kazhdyidnevnik.test/androidx.test.runner.AndroidJUnitRunner > screens.log 2>&1 || true
            adb logcat -d -v time > logcat.txt 2>&1 || true
            adb shell am instrument -w -e class io.github.cmix7777.kazhdyidnevnik.TogetherWeekShotsTest,io.github.cmix7777.kazhdyidnevnik.SpecialDayShotsTest,io.github.cmix7777.kazhdyidnevnik.WeatherShotsTest,io.github.cmix7777.kazhdyidnevnik.LiveUiShotsTest,io.github.cmix7777.kazhdyidnevnik.GreetingRealAppTest io.github.cmix7777.kazhdyidnevnik.test/androidx.test.runner.AndroidJUnitRunner > instrument.log 2>&1 || true
            adb pull /sdcard/Android/data/io.github.cmix7777.kazhdyidnevnik/files/shots shots || true

      - name: Отчёт проверки
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/report" && cd "$RUNNER_TEMP/report"
          {
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "build=${BUILD}"
            echo "result=${RESULT}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- errors ---"
            grep -E "^e: |error:|FAILED|BUILD|tests completed|warning:.*deprecated" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | grep -v SystemServerTiming | head -n 40 || true
            echo "--- what went wrong ---"
            grep -A 25 "What went wrong" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -n 120 || true
            echo "--- instrument ---"
            tail -n 80 "$GITHUB_WORKSPACE/instrument.log" 2>/dev/null || true
            echo "--- screens ---"
            grep -v "^\s*at " "$GITHUB_WORKSPACE/screens.log" 2>/dev/null | tail -n 40 || true
            echo "--- logcat ---"
            grep -iE "Denying clipboard|ANR in|not responding|FATAL EXCEPTION|Input dispatching timed out" "$GITHUB_WORKSPACE/logcat.txt" 2>/dev/null | grep -v SystemServerTiming | head -n 40 || true
          } > status.txt
          cp -r "$GITHUB_WORKSPACE/shots" . 2>/dev/null || true
          mkdir -p tests && cp -r "$GITHUB_WORKSPACE"/app/build/test-results/testDebugUnitTest/*.xml tests/ 2>/dev/null || true
          git init -q
          git checkout -q -b ci-check
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Проверка ${GITHUB_RUN_NUMBER}: ${RESULT}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-check
