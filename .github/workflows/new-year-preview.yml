name: Предпросмотр новогоднего режима

on:
  push:
    branches: [preview/new-year]

permissions:
  contents: write

concurrency:
  group: new-year-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build the unchanged debug app
        id: build
        shell: bash
        run: |
          mkdir -p preview-output
          gradle --no-daemon assembleDebug 2>&1 | tee preview-output/build.log
      - name: Set up screenshot tools
        if: steps.build.outcome == 'success'
        run: |
          python3 -m venv "$RUNNER_TEMP/preview-python"
          "$RUNNER_TEMP/preview-python/bin/pip" install Pillow
          echo "$RUNNER_TEMP/preview-python/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the holiday decorations on Android
        id: capture
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: python3 .github/new-year-preview/capture.py
      - name: Save the cropped screenshots and build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.build.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
        run: |
          result="$RUNNER_TEMP/new-year-preview-result"
          mkdir -p "$result"
          {
            echo "run=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "build=$BUILD"
            echo "capture=$CAPTURE"
            if [ "$BUILD" = failure ]; then
              grep -E '^e: |^error:|^FAILURE:|^\* What went wrong:|^Execution failed|^> |^BUILD ' preview-output/build.log | head -n 55 || true
            fi
          } > "$result/status.txt"
          for name in today chat; do
            if [ -f "preview-output/$name.png" ]; then
              cp "preview-output/$name.png" "$result/"
            fi
          done
          cd "$result"
          git init -q -b preview/new-year-shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Кадры новогоднего режима"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/preview/new-year-shots
